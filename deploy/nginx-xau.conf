# Blok nginx untuk dasbor XAU — satu file HTML statis, tanpa build step.
#
# Pasang di VPS:
#   sudo cp deploy/nginx-xau.conf /etc/nginx/sites-available/xau
#   sudo ln -sf /etc/nginx/sites-available/xau /etc/nginx/sites-enabled/xau
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (gratis, sekali jalan):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d xau.domain-anda.com

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain/subdomain Anda; pakai _ kalau mau diakses lewat IP saja.
    server_name xau.domain-anda.com;

    root /var/www/xau;
    index xau-pipeline.html;

    # Dasbor ini bukan untuk publik — buka baris di bawah supaya minta password.
    # Buat dulu filenya:  sudo apt install apache2-utils
    #                     sudo htpasswd -c /etc/nginx/.htpasswd bryan
    # auth_basic           "Dasbor XAU";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /xau-pipeline.html;
    }

    # File HTML-nya mandiri dan sering diperbarui — jangan di-cache lama.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Halaman ini memuat font dari Google Fonts; header di bawah aman untuk itu.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;
}
